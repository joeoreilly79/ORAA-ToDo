<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORAA To Do</title>
<style>
  :root {
    --navy: #1b2a4a;
    --navy-dark: #12203a;
    --gold: #b3924a;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #22273a;
    --muted: #6b7280;
    --done: #9ca3af;
    --danger: #b3454a;
    --p5: #b3454a;
    --p4: #c97a3a;
    --p3: #b3924a;
    --p2: #5a7fa6;
    --p1: #8a93a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.3px; }
  header .status { font-size: 12px; color: #cfd6e4; }
  header .status.error { color: #f3b3b3; }
  header .status.ok { color: #b6e3c6; }
  #syncBtn {
    background: transparent; border: 1px solid rgba(255,255,255,0.35); color: #fff;
    border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  #syncBtn:hover { background: rgba(255,255,255,0.1); }

  nav#tabs { display: flex; overflow-x: auto; background: var(--navy-dark); padding: 0 10px; }
  nav#tabs button {
    background: none; border: none; color: #b9c2d6; padding: 12px 14px; font-size: 13.5px;
    white-space: nowrap; cursor: pointer; border-bottom: 3px solid transparent;
  }
  nav#tabs button.active { color: #fff; border-bottom: 3px solid var(--gold); font-weight: 600; }

  main { max-width: 720px; margin: 0 auto; padding: 18px 14px 80px; }

  .addRow { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .addRow input[type=text] {
    flex: 1; min-width: 160px; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; background: var(--card);
  }
  .addRow select#prioritySelect {
    padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    background: var(--card);
  }
  .addRow button {
    background: var(--navy); color: #fff; border: none; border-radius: 8px;
    padding: 0 16px; font-size: 14px; cursor: pointer;
  }
  .addRow button:active { opacity: 0.85; }
  .addHint { font-size: 11.5px; color: var(--muted); margin-bottom: 16px; }

  .priorityHeader {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--muted); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
  }
  .priorityHeader:first-child { margin-top: 0; }

  ul.tasks { list-style: none; margin: 0; padding: 0; }
  li.task {
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--p3);
    border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px;
  }
  li.task.p5 { border-left-color: var(--p5); }
  li.task.p4 { border-left-color: var(--p4); }
  li.task.p3 { border-left-color: var(--p3); }
  li.task.p2 { border-left-color: var(--p2); }
  li.task.p1 { border-left-color: var(--p1); }

  li.task .chk {
    width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--navy);
    flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  li.task.done .chk { background: var(--navy); }
  li.task .chk svg { display: none; width: 12px; height: 12px; }
  li.task.done .chk svg { display: block; }
  li.task .txt { flex: 1; font-size: 14.5px; line-height: 1.4; word-break: break-word; }
  li.task.done .txt { color: var(--done); text-decoration: line-through; }
  li.task .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  li.task .meta select.prioPick {
    font-size: 11px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 4px; background: #fff;
  }
  li.task .actions { display: flex; gap: 6px; flex-shrink: 0; }
  li.task .actions button {
    background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 2px 4px;
  }
  li.task .actions button.del:hover { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 30px 10px; }

  #setupOverlay {
    position: fixed; inset: 0; background: rgba(20,25,45,0.55); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  #setupOverlay .box { background: #fff; border-radius: 12px; padding: 24px; max-width: 420px; width: 100%; }
  #setupOverlay h2 { margin-top: 0; font-size: 17px; color: var(--navy); }
  #setupOverlay p { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  #setupOverlay input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; margin-bottom: 10px;
  }
  #setupOverlay button.primary {
    width: 100%; background: var(--navy); color: #fff; border: none; border-radius: 8px;
    padding: 11px; font-size: 14px; cursor: pointer;
  }
  #setupOverlay .err { color: var(--danger); font-size: 12.5px; margin-top: 6px; min-height: 16px; }

  li.task .actions button.edit:hover { color: var(--navy); }
  li.task .actions button.sub:hover { color: var(--navy); }
  .editInput {
    flex: 1; font-size: 14.5px; padding: 4px 6px; border: 1px solid var(--navy);
    border-radius: 5px; font-family: inherit;
  }
  .subToggle {
    font-size: 11px; color: var(--muted); cursor: pointer; user-select: none;
  }
  .subSection { margin-top: 8px; padding-left: 4px; border-left: 2px solid var(--border); }
  .subRow { display: flex; align-items: center; gap: 8px; padding: 4px 0 4px 8px; }
  .subRow .subChk {
    width: 15px; height: 15px; border-radius: 4px; border: 2px solid var(--navy);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .subRow.done .subChk { background: var(--navy); }
  .subRow .subChk svg { display: none; width: 9px; height: 9px; }
  .subRow.done .subChk svg { display: block; }
  .subRow .subTxt { flex: 1; font-size: 13px; word-break: break-word; }
  .subRow.done .subTxt { color: var(--done); text-decoration: line-through; }
  .subRow .subDel { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; }
  .subRow .subDel:hover { color: var(--danger); }
  .subAddRow { display: flex; gap: 6px; padding: 4px 0 4px 8px; }
  .subAddRow input {
    flex: 1; font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  }
  .subAddRow button {
    background: var(--navy); color: #fff; border: none; border-radius: 6px; padding: 0 10px; font-size: 12px; cursor: pointer;
  }
  li.task:not(.done).p5 .txt { color: var(--p5); font-weight: 600; }
  li.task:not(.done).p4 .txt { color: var(--p4); font-weight: 600; }
  li.task:not(.done).p3 .txt { color: var(--p3); }
  li.task:not(.done).p2 .txt { color: var(--p2); }
  li.task:not(.done).p1 .txt { color: var(--p1); }
</style>
</head>
<body>

<div id="setupOverlay">
  <div class="box">
    <h2>Connect to GitHub</h2>
    <p>Enter your fine-grained personal access token to sync tasks to <b>joeoreilly79/ORAA-ToDo</b>. This is stored only in this browser's local storage — never sent anywhere except directly to GitHub's API.</p>
    <input id="tokenInput" type="password" placeholder="github_pat_...">
    <button class="primary" id="saveTokenBtn">Connect</button>
    <div class="err" id="tokenErr"></div>
  </div>
</div>

<header>
  <h1>ORAA To Do</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="status" id="statusText">Loading…</span>
    <button id="syncBtn" title="Sync now">Sync</button>
  </div>
</header>

<nav id="tabs"></nav>

<main>
  <div class="addRow" id="addRowWrap">
    <input type="text" id="newTaskInput" placeholder="Add a task…">
    <select id="prioritySelect">
      <option value="5">5 — Today</option>
      <option value="4">4 — High</option>
      <option value="3" selected>3 — Medium</option>
      <option value="2">2 — Low</option>
      <option value="1">1 — Someday</option>
    </select>
    <button id="addTaskBtn">Add</button>
  </div>
  <div class="addHint" id="addHint"></div>
  <ul class="tasks" id="taskList"></ul>
</main>

<script>
const OWNER = "joeoreilly79";
const REPO = "ORAA-ToDo";
const FILE_PATH = "data.json";
const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;

const REAL_PROJECTS = ["Jamestown & Belgard", "Lapitus", "Sorrento", "RTB", "Ballsbridge", "Raheny", "Personal"];
const TABS = ["Day to Day", ...REAL_PROJECTS];
const GENERAL_PROJECT = "General";

// state.tasks is a FLAT array: {id, text, done, created, project, priority}
let state = { tasks: [] };
let fileSha = null;
let currentTab = TABS[0];
let token = localStorage.getItem("oraa_todo_token") || "";
let dirty = false;

function setStatus(text, cls) {
  const el = document.getElementById("statusText");
  el.textContent = text;
  el.className = "status" + (cls ? " " + cls : "");
}

function ghHeaders() {
  return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
}

function migrateIfNeeded(parsed) {
  // Old format: { tasks: { "ProjectName": [ {id,text,done,created,origin?} ] } }
  if (parsed && parsed.tasks && !Array.isArray(parsed.tasks)) {
    const flat = [];
    Object.keys(parsed.tasks).forEach(key => {
      (parsed.tasks[key] || []).forEach(t => {
        // Skip duplicate "pulled" copies that had an origin (old Day to Day mechanism) —
        // keep only originals, defaulting project appropriately.
        if (key === "Day to Day" && t.origin) return; // drop old pulled duplicates
        const project = key === "Day to Day" ? GENERAL_PROJECT : key;
        flat.push({
          id: t.id,
          text: t.text,
          done: !!t.done,
          created: t.created || new Date().toISOString(),
          project: project,
          priority: 3
        });
      });
    });
    return { tasks: flat };
  }
  if (parsed && Array.isArray(parsed.tasks)) {
    parsed.tasks.forEach(t => {
      if (!t.priority) t.priority = 3;
      if (!t.project) t.project = GENERAL_PROJECT;
      if (!t.subtasks) t.subtasks = [];
    });
    return parsed;
  }
  return { tasks: [] };
}

async function loadFromGitHub() {
  setStatus("Syncing…");
  try {
    const res = await fetch(API_BASE, { headers: ghHeaders() });
    if (res.status === 404) {
      state = { tasks: [] };
      await saveToGitHub(true);
      setStatus("Connected", "ok");
      render();
      return;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    fileSha = json.sha;
    const content = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ""))));
    const parsed = JSON.parse(content);
    state = migrateIfNeeded(parsed);
    setStatus("Synced just now", "ok");
  } catch (e) {
    console.error(e);
    setStatus("Sync failed — check token", "error");
  }
  render();
}

async function saveToGitHub(isInit) {
  setStatus("Saving…");
  try {
    const body = {
      message: isInit ? "Initialize ORAA To Do data" : "Update tasks " + new Date().toISOString(),
      content: btoa(unescape(encodeURIComponent(JSON.stringify(state, null, 2))))
    };
    if (fileSha) body.sha = fileSha;
    const res = await fetch(API_BASE, {
      method: "PUT",
      headers: { ...ghHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      throw new Error(errJson.message || ("HTTP " + res.status));
    }
    const json = await res.json();
    fileSha = json.content.sha;
    dirty = false;
    setStatus("Saved", "ok");
  } catch (e) {
    console.error(e);
    setStatus("Save failed: " + e.message, "error");
  }
}

let saveTimer = null;
function queueSave() {
  dirty = true;
  setStatus("Unsaved changes…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToGitHub(false), 1200);
}

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TABS.forEach(p => {
    const btn = document.createElement("button");
    btn.textContent = p;
    if (p === currentTab) btn.classList.add("active");
    btn.onclick = () => { currentTab = p; render(); };
    nav.appendChild(btn);
  });
}

function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  } catch (e) { return ""; }
}

function tasksForCurrentTab() {
  if (currentTab === "Day to Day") return state.tasks.slice();
  return state.tasks.filter(t => t.project === currentTab);
}

function render() {
  renderTabs();

  const hint = document.getElementById("addHint");
  if (currentTab === "Day to Day") {
    hint.textContent = "Adding here files the task under 'General' — it'll show in Day to Day only.";
  } else {
    hint.textContent = "Adding here also shows the task in Day to Day, sorted by priority.";
  }

  const list = document.getElementById("taskList");
  list.innerHTML = "";
  const tasks = tasksForCurrentTab();

  const notDone = tasks.filter(t => !t.done).sort((a, b) => {
    if (b.priority !== a.priority) return b.priority - a.priority;
    return (a.created || "").localeCompare(b.created || "");
  });
  const done = tasks.filter(t => t.done).sort((a, b) => (b.created || "").localeCompare(a.created || ""));

  if (tasks.length === 0) {
    const div = document.createElement("div");
    div.className = "empty";
    div.textContent = "No tasks yet in " + currentTab + ".";
    list.appendChild(div);
    return;
  }

  let lastPriority = null;
  notDone.forEach(t => {
    if (t.priority !== lastPriority) {
      lastPriority = t.priority;
      const h = document.createElement("div");
      h.className = "priorityHeader";
      h.textContent = priorityLabel(t.priority);
      list.appendChild(h);
    }
    list.appendChild(taskRow(t));
  });

  if (done.length) {
    const h = document.createElement("div");
    h.className = "priorityHeader";
    h.textContent = "Done";
    list.appendChild(h);
    done.forEach(t => list.appendChild(taskRow(t)));
  }
}

function priorityLabel(p) {
  return { 5: "5 — Today", 4: "4 — High", 3: "3 — Medium", 2: "2 — Low", 1: "1 — Someday" }[p] || (p + "");
}

let expandedTasks = {};

function taskRow(t) {
  if (!t.subtasks) t.subtasks = [];
  const li = document.createElement("li");
  li.style.flexDirection = "column";
  li.style.alignItems = "stretch";
  li.className = "task p" + t.priority + (t.done ? " done" : "");

  const topRow = document.createElement("div");
  topRow.style.display = "flex";
  topRow.style.alignItems = "flex-start";
  topRow.style.gap = "10px";

  const chk = document.createElement("div");
  chk.className = "chk";
  chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>';
  chk.onclick = () => toggleTask(t.id);

  const txtWrap = document.createElement("div");
  txtWrap.style.flex = "1";

  const txt = document.createElement("div");
  txt.className = "txt";
  txt.textContent = t.text;
  txt.ondblclick = () => startEdit(t.id, txt, txtWrap);

  const meta = document.createElement("div");
  meta.className = "meta";

  const projSpan = document.createElement("span");
  projSpan.textContent = (currentTab === "Day to Day" ? t.project : fmtDate(t.created));
  meta.appendChild(projSpan);

  if (currentTab === "Day to Day") {
    const dateSpan = document.createElement("span");
    dateSpan.textContent = "· " + fmtDate(t.created);
    meta.appendChild(dateSpan);
  }

  const prioSelect = document.createElement("select");
  prioSelect.className = "prioPick";
  [5,4,3,2,1].forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = "P" + p;
    if (p === t.priority) opt.selected = true;
    prioSelect.appendChild(opt);
  });
  prioSelect.onchange = () => changePriority(t.id, parseInt(prioSelect.value, 10));
  meta.appendChild(prioSelect);

  const doneSubs = t.subtasks.filter(s => s.done).length;
  const subToggle = document.createElement("span");
  subToggle.className = "subToggle";
  const isExpanded = !!expandedTasks[t.id];
  subToggle.textContent = (isExpanded ? "▾ " : "▸ ") + "Subtasks" + (t.subtasks.length ? " (" + doneSubs + "/" + t.subtasks.length + ")" : "");
  subToggle.onclick = () => { expandedTasks[t.id] = !expandedTasks[t.id]; render(); };
  meta.appendChild(subToggle);

  txtWrap.appendChild(txt);
  txtWrap.appendChild(meta);

  const actions = document.createElement("div");
  actions.className = "actions";

  const editBtn = document.createElement("button");
  editBtn.className = "edit";
  editBtn.title = "Edit";
  editBtn.textContent = "✎";
  editBtn.onclick = () => startEdit(t.id, txt, txtWrap);
  actions.appendChild(editBtn);

  const delBtn = document.createElement("button");
  delBtn.className = "del";
  delBtn.title = "Delete";
  delBtn.textContent = "✕";
  delBtn.onclick = () => deleteTask(t.id);
  actions.appendChild(delBtn);

  topRow.appendChild(chk);
  topRow.appendChild(txtWrap);
  topRow.appendChild(actions);
  li.appendChild(topRow);

  if (isExpanded) {
    li.appendChild(subtaskSection(t));
  }

  return li;
}

function startEdit(id, txtEl, container) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const input = document.createElement("input");
  input.className = "editInput";
  input.type = "text";
  input.value = t.text;
  container.replaceChild(input, txtEl);
  input.focus();
  input.select();
  const commit = () => {
    const val = input.value.trim();
    if (val) t.text = val;
    queueSave();
    render();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { commit(); }
    if (e.key === "Escape") { render(); }
  });
  input.addEventListener("blur", commit);
}

function subtaskSection(t) {
  const wrap = document.createElement("div");
  wrap.className = "subSection";

  t.subtasks.forEach(s => {
    const row = document.createElement("div");
    row.className = "subRow" + (s.done ? " done" : "");

    const chk = document.createElement("div");
    chk.className = "subChk";
    chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"><path d="M4 12l6 6L20 6"/></svg>';
    chk.onclick = () => { s.done = !s.done; queueSave(); render(); };

    const txt = document.createElement("div");
    txt.className = "subTxt";
    txt.textContent = s.text;
    txt.ondblclick = () => {
      const input = document.createElement("input");
      input.className = "editInput";
      input.style.fontSize = "13px";
      input.value = s.text;
      row.replaceChild(input, txt);
      input.focus(); input.select();
      const commit = () => { const v = input.value.trim(); if (v) s.text = v; queueSave(); render(); };
      input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); if (e.key === "Escape") render(); });
      input.addEventListener("blur", commit);
    };

    const del = document.createElement("button");
    del.className = "subDel";
    del.textContent = "✕";
    del.onclick = () => { t.subtasks = t.subtasks.filter(x => x.id !== s.id); queueSave(); render(); };

    row.appendChild(chk);
    row.appendChild(txt);
    row.appendChild(del);
    wrap.appendChild(row);
  });

  const addRow = document.createElement("div");
  addRow.className = "subAddRow";
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Add subtask…";
  const addBtn = document.createElement("button");
  addBtn.textContent = "Add";
  const doAdd = () => {
    const val = input.value.trim();
    if (!val) return;
    t.subtasks.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: val, done: false });
    input.value = "";
    queueSave();
    render();
  };
  addBtn.onclick = doAdd;
  input.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
  addRow.appendChild(input);
  addRow.appendChild(addBtn);
  wrap.appendChild(addRow);

  return wrap;
}

function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (t) { t.done = !t.done; queueSave(); render(); }
}

function changePriority(id, p) {
  const t = state.tasks.find(x => x.id === id);
  if (t) { t.priority = p; queueSave(); render(); }
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(x => x.id !== id);
  queueSave();
  render();
}

function addTask(text, priority) {
  if (!text.trim()) return;
  const project = currentTab === "Day to Day" ? GENERAL_PROJECT : currentTab;
  const t = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    text: text.trim(),
    done: false,
    created: new Date().toISOString(),
    project: project,
    priority: priority
  };
  state.tasks.push(t);
  queueSave();
  render();
}

document.getElementById("addTaskBtn").onclick = () => {
  const input = document.getElementById("newTaskInput");
  const prio = parseInt(document.getElementById("prioritySelect").value, 10);
  addTask(input.value, prio);
  input.value = "";
  input.focus();
};
document.getElementById("newTaskInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("addTaskBtn").click();
});
document.getElementById("syncBtn").onclick = () => loadFromGitHub();

document.getElementById("saveTokenBtn").onclick = async () => {
  const val = document.getElementById("tokenInput").value.trim();
  if (!val.startsWith("github_pat_") && !val.startsWith("ghp_")) {
    document.getElementById("tokenErr").textContent = "That doesn't look like a GitHub token.";
    return;
  }
  token = val;
  localStorage.setItem("oraa_todo_token", token);
  document.getElementById("setupOverlay").style.display = "none";
  await loadFromGitHub();
};

if (token) {
  document.getElementById("setupOverlay").style.display = "none";
  loadFromGitHub();
} else {
  setStatus("Not connected");
}
render();

window.addEventListener("beforeunload", (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ""; }
});
</script>
