<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joe To Do</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Joe To Do">
<meta name="theme-color" content="#1b2a4a">
<style>
  :root {
    --navy: #1b2a4a;
    --navy-dark: #12203a;
    --gold: #b3924a;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #22273a;
    --muted: #6b7280;
    --done: #9ca3af;
    --danger: #b3454a;
    --p5: #b3454a;
    --p4: #c97a3a;
    --p3: #b3924a;
    --p2: #5a7fa6;
    --p1: #8a93a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.3px; }
  header .status { font-size: 12px; color: #cfd6e4; }
  header .status.error { color: #f3b3b3; }
  header .status.ok { color: #b6e3c6; }
  #syncBtn {
    background: transparent; border: 1px solid rgba(255,255,255,0.35); color: #fff;
    border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  #syncBtn:hover { background: rgba(255,255,255,0.1); }

  nav#tabs { display: flex; overflow-x: auto; background: var(--navy-dark); padding: 0 10px; }
  nav#tabs button {
    background: none; border: none; color: #b9c2d6; padding: 12px 14px; font-size: 13.5px;
    white-space: nowrap; cursor: pointer; border-bottom: 3px solid transparent;
  }
  nav#tabs button.active { color: #fff; border-bottom: 3px solid var(--gold); font-weight: 600; }

  main { max-width: 720px; margin: 0 auto; padding: 18px 14px 80px; }

  .addRow { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .addRow input[type=text] {
    flex: 1; min-width: 160px; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 14px; background: var(--card);
  }
  .addRow select#prioritySelect, .addRow input#dueDateInput {
    padding: 0 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    background: var(--card);
  }
  .addRow button {
    background: var(--navy); color: #fff; border: none; border-radius: 8px;
    padding: 0 16px; font-size: 14px; cursor: pointer;
  }
  .addRow button:active { opacity: 0.85; }
  .addHint { font-size: 11.5px; color: var(--muted); margin-bottom: 16px; }

  .priorityHeader {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--muted); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border);
  }
  .priorityHeader:first-child { margin-top: 0; }

  ul.tasks { list-style: none; margin: 0; padding: 0; }
  li.task {
    background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--p3);
    border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px;
  }
  li.task.p5 { border-left-color: var(--p5); }
  li.task.p4 { border-left-color: var(--p4); }
  li.task.p3 { border-left-color: var(--p3); }
  li.task.p2 { border-left-color: var(--p2); }
  li.task.p1 { border-left-color: var(--p1); }

  li.task .chk {
    width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--navy);
    flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  li.task.done .chk { background: var(--navy); }
  li.task .chk svg { display: none; width: 12px; height: 12px; }
  li.task.done .chk svg { display: block; }
  li.task .txt { flex: 1; font-size: 14.5px; line-height: 1.4; word-break: break-word; }
  li.task.done .txt { color: var(--done); text-decoration: line-through; }
  li.task .meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  li.task .meta select.prioPick {
    font-size: 11px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 4px; background: #fff;
  }
  li.task .actions { display: flex; gap: 6px; flex-shrink: 0; }
  li.task .actions button {
    background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 2px 4px;
  }
  li.task .actions button.del:hover { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 30px 10px; }

  #setupOverlay {
    position: fixed; inset: 0; background: rgba(20,25,45,0.55); display: flex;
    align-items: center; justify-content: center; padding: 20px; z-index: 100;
  }
  #setupOverlay .box { background: #fff; border-radius: 12px; padding: 24px; max-width: 420px; width: 100%; }
  #setupOverlay h2 { margin-top: 0; font-size: 17px; color: var(--navy); }
  #setupOverlay p { font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  #setupOverlay input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; margin-bottom: 10px;
  }
  #setupOverlay button.primary {
    width: 100%; background: var(--navy); color: #fff; border: none; border-radius: 8px;
    padding: 11px; font-size: 14px; cursor: pointer;
  }
  #setupOverlay .err { color: var(--danger); font-size: 12.5px; margin-top: 6px; min-height: 16px; }

  li.task .actions button.edit:hover { color: var(--navy); }
  li.task .actions button.share:hover { color: var(--navy); }
  li.task .actions button.sub:hover { color: var(--navy); }
  .editInput {
    flex: 1; font-size: 14.5px; padding: 4px 6px; border: 1px solid var(--navy);
    border-radius: 5px; font-family: inherit;
  }
  .subToggle {
    font-size: 11px; color: var(--muted); cursor: pointer; user-select: none;
  }
  .subSection { margin-top: 8px; padding-left: 4px; border-left: 2px solid var(--border); }
  .subRow { display: flex; align-items: center; gap: 8px; padding: 4px 0 4px 8px; }
  .subRow .subChk {
    width: 15px; height: 15px; border-radius: 4px; border: 2px solid var(--navy);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .subRow.done .subChk { background: var(--navy); }
  .subRow .subChk svg { display: none; width: 9px; height: 9px; }
  .subRow.done .subChk svg { display: block; }
  .subRow .subTxt { flex: 1; font-size: 13px; word-break: break-word; }
  .subRow.done .subTxt { color: var(--done); text-decoration: line-through; }
  .subRow .subDel { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; }
  .subRow .subDel:hover { color: var(--danger); }
  .subAddRow { display: flex; gap: 6px; padding: 4px 0 4px 8px; }
  .subAddRow input {
    flex: 1; font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  }
  .subAddRow button {
    background: var(--navy); color: #fff; border: none; border-radius: 6px; padding: 0 10px; font-size: 12px; cursor: pointer;
  }
  li.task:not(.done).p5 .txt { color: var(--p5); font-weight: 600; }
  li.task:not(.done).p4 .txt { color: var(--p4); font-weight: 600; }
  li.task:not(.done).p3 .txt { color: var(--p3); }
  li.task:not(.done).p2 .txt { color: var(--p2); }
  li.task:not(.done).p1 .txt { color: var(--p1); }
</style>
</head>
<body>

<div id="setupOverlay">
  <div class="box">
    <h2>Connect to GitHub</h2>
    <p>Enter your fine-grained personal access token to sync tasks to <b>joeoreilly79/ORAA-ToDo</b>. This is stored only in this browser's local storage — never sent anywhere except directly to GitHub's API.</p>
    <input id="tokenInput" type="password" placeholder="github_pat_...">
    <button class="primary" id="saveTokenBtn">Connect</button>
    <div class="err" id="tokenErr"></div>
  </div>
</div>

<header>
  <h1>Joe To Do</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="status" id="statusText">Loading…</span>
    <button id="toggleSubtasksBtn" style="background:transparent;border:1px solid rgba(255,255,255,0.35);color:#fff;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;">Show subtasks</button>
    <button id="syncBtn" title="Sync now">Sync</button>
  </div>
</header>

<nav id="tabs"></nav>

<main>
  <div class="addRow" id="addRowWrap">
    <input type="text" id="newTaskInput" placeholder="Add a task…">
    <select id="prioritySelect">
      <option value="5">5 — Today</option>
      <option value="4">4 — High</option>
      <option value="3" selected>3 — Medium</option>
      <option value="2">2 — Low</option>
      <option value="1">1 — Someday</option>
    </select>
    <input type="date" id="dueDateInput" title="Due date (optional)">
    <button id="addTaskBtn">Add</button>
  </div>
  <div style="display:flex; justify-content:flex-end; align-items:center; margin-bottom:16px;">
    <button id="shareListBtn" style="background:none;border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--navy);cursor:pointer;white-space:nowrap;">↥ Share list</button>
  </div>
  <div class="addHint" id="addHint" style="margin-bottom:16px;margin-top:-10px;"></div>
  <ul class="tasks" id="taskList"></ul>
</main>

<script>
const OWNER = "joeoreilly79";
const REPO = "ORAA-ToDo";
const FILE_PATH = "data.json";
const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`;

const DEFAULT_PROJECTS = ["Jamestown & Belgard", "Lapitus", "Sorrento", "RTB", "Ballsbridge", "Raheny", "Personal"];
const GENERAL_PROJECT = "General";
function currentTabs() {
  const active = state.projects.filter(p => !(state.archivedProjects||[]).includes(p));
  return ["Day to Day", ...active];
}

function moveProject(name, dir) {
  const archived = state.archivedProjects || [];
  const activeNames = state.projects.filter(p => !archived.includes(p));
  const idx = activeNames.indexOf(name);
  const targetIdx = idx + dir;
  if (targetIdx < 0 || targetIdx >= activeNames.length) return;
  const otherName = activeNames[targetIdx];
  const i1 = state.projects.indexOf(name);
  const i2 = state.projects.indexOf(otherName);
  const tmp = state.projects[i1];
  state.projects[i1] = state.projects[i2];
  state.projects[i2] = tmp;
  queueSave();
}

// state.tasks is a FLAT array: {id, text, done, created, project, priority}
let state = { tasks: [], projects: DEFAULT_PROJECTS.slice(), archivedProjects: [] };
let fileSha = null;
let currentTab = "Day to Day";
let token = localStorage.getItem("oraa_todo_token") || "";
let dirty = false;

function setStatus(text, cls) {
  const el = document.getElementById("statusText");
  el.textContent = text;
  el.className = "status" + (cls ? " " + cls : "");
}

function ghHeaders() {
  return { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" };
}

function migrateIfNeeded(parsed) {
  // Old format: { tasks: { "ProjectName": [ {id,text,done,created,origin?} ] } }
  if (parsed && parsed.tasks && !Array.isArray(parsed.tasks)) {
    const flat = [];
    Object.keys(parsed.tasks).forEach(key => {
      (parsed.tasks[key] || []).forEach(t => {
        // Skip duplicate "pulled" copies that had an origin (old Day to Day mechanism) —
        // keep only originals, defaulting project appropriately.
        if (key === "Day to Day" && t.origin) return; // drop old pulled duplicates
        const project = key === "Day to Day" ? GENERAL_PROJECT : key;
        flat.push({
          id: t.id,
          text: t.text,
          done: !!t.done,
          created: t.created || new Date().toISOString(),
          project: project,
          priority: 3
        });
      });
    });
    const projectsSet = new Set(DEFAULT_PROJECTS);
    flat.forEach(t => { if (t.project !== GENERAL_PROJECT) projectsSet.add(t.project); });
    return { tasks: flat, projects: Array.from(projectsSet), archivedProjects: [] };
  }
  if (parsed && Array.isArray(parsed.tasks)) {
    parsed.tasks.forEach(t => {
      if (!t.priority) t.priority = 3;
      if (!t.project) t.project = GENERAL_PROJECT;
      if (!t.subtasks) t.subtasks = [];
      if (t.due === undefined) t.due = null;
    });
    let projects = Array.isArray(parsed.projects) ? parsed.projects.slice() : DEFAULT_PROJECTS.slice();
    parsed.tasks.forEach(t => { if (t.project !== GENERAL_PROJECT && !projects.includes(t.project)) projects.push(t.project); });
    const archivedProjects = Array.isArray(parsed.archivedProjects) ? parsed.archivedProjects : [];
    return { tasks: parsed.tasks, projects: projects, archivedProjects: archivedProjects };
  }
  return { tasks: [], projects: DEFAULT_PROJECTS.slice(), archivedProjects: [] };
}

const CACHE_KEY = "oraa_todo_cache";

function cacheLocally() {
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ state: state, fileSha: fileSha, savedAt: new Date().toISOString() }));
  } catch (e) { /* ignore quota errors */ }
}

function loadLocalCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}

async function loadFromGitHub() {
  if (!navigator.onLine) {
    const cached = loadLocalCache();
    if (cached) {
      state = cached.state;
      fileSha = cached.fileSha;
      setStatus("Offline — showing last synced version", "error");
    } else {
      setStatus("Offline — nothing cached yet", "error");
    }
    render();
    return;
  }
  setStatus("Syncing…");
  try {
    const res = await fetch(API_BASE, { headers: ghHeaders() });
    if (res.status === 404) {
      state = { tasks: [], projects: DEFAULT_PROJECTS.slice(), archivedProjects: [] };
      await saveToGitHub(true);
      setStatus("Connected", "ok");
      render();
      return;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    fileSha = json.sha;
    const content = decodeURIComponent(escape(atob(json.content.replace(/\n/g, ""))));
    const parsed = JSON.parse(content);
    state = migrateIfNeeded(parsed);
    cacheLocally();
    setStatus("Synced just now", "ok");
  } catch (e) {
    console.error(e);
    const cached = loadLocalCache();
    if (cached) {
      state = cached.state;
      fileSha = cached.fileSha;
      setStatus("Offline — showing last synced version", "error");
    } else {
      setStatus("Sync failed — check token", "error");
    }
  }
  render();
}

async function saveToGitHub(isInit) {
  cacheLocally();
  if (!navigator.onLine) {
    setStatus("Offline — saved locally, will sync", "error");
    return;
  }
  setStatus("Saving…");
  try {
    const body = {
      message: isInit ? "Initialize Joe To Do data" : "Update tasks " + new Date().toISOString(),
      content: btoa(unescape(encodeURIComponent(JSON.stringify(state, null, 2))))
    };
    if (fileSha) body.sha = fileSha;
    const res = await fetch(API_BASE, {
      method: "PUT",
      headers: { ...ghHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}));
      throw new Error(errJson.message || ("HTTP " + res.status));
    }
    const json = await res.json();
    fileSha = json.content.sha;
    dirty = false;
    cacheLocally();
    setStatus("Saved", "ok");
  } catch (e) {
    console.error(e);
    // Likely a network drop mid-request — keep it queued, don't discard the change.
    setStatus("Offline — saved locally, will sync", "error");
  }
}

let saveTimer = null;
function queueSave() {
  dirty = true;
  cacheLocally();
  setStatus(navigator.onLine ? "Unsaved changes…" : "Offline — saved locally, will sync", "error");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToGitHub(false), 1200);
}

window.addEventListener("online", () => {
  setStatus("Back online — syncing…");
  if (dirty) { saveToGitHub(false); } else { loadFromGitHub(); }
});
window.addEventListener("offline", () => {
  setStatus("Offline — you can keep working", "error");
});

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  currentTabs().forEach(p => {
    const btn = document.createElement("button");
    btn.textContent = p;
    if (p === currentTab) btn.classList.add("active");
    btn.onclick = () => { currentTab = p; render(); };
    nav.appendChild(btn);
  });
  const addBtn = document.createElement("button");
  addBtn.textContent = "+ Add project";
  addBtn.style.color = "#d9c98a";
  addBtn.onclick = addProject;
  nav.appendChild(addBtn);

  const manageBtn = document.createElement("button");
  manageBtn.textContent = "⚙ Manage";
  manageBtn.style.color = "#8f9ab0";
  manageBtn.onclick = openManageProjects;
  nav.appendChild(manageBtn);
}

function refreshManagePanel(overlay) {
  document.body.removeChild(overlay);
  render();
  openManageProjects();
}

function openManageProjects() {
  const overlay = document.createElement("div");
  overlay.id = "manageOverlay";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(20,25,45,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;";

  const box = document.createElement("div");
  box.style.cssText = "background:#fff;border-radius:12px;padding:22px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;";

  const h = document.createElement("h2");
  h.textContent = "Manage projects";
  h.style.cssText = "margin-top:0;font-size:17px;color:#1b2a4a;";
  box.appendChild(h);

  const activeLabel = document.createElement("div");
  activeLabel.textContent = "Active";
  activeLabel.style.cssText = "font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin:14px 0 6px;";
  box.appendChild(activeLabel);

  const active = state.projects.filter(p => !(state.archivedProjects||[]).includes(p));
  if (active.length === 0) {
    const e = document.createElement("div");
    e.style.cssText = "font-size:13px;color:#6b7280;padding:6px 0;";
    e.textContent = "No active projects.";
    box.appendChild(e);
  }
  active.forEach((p, i) => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e2e4e9;gap:8px;";
    const name = document.createElement("span");
    name.textContent = p;
    name.style.cssText = "font-size:14px;flex:1;";

    const controls = document.createElement("div");
    controls.style.cssText = "display:flex;gap:4px;align-items:center;";

    const leftBtn = document.createElement("button");
    leftBtn.textContent = "←";
    leftBtn.disabled = i === 0;
    leftBtn.style.cssText = "background:none;border:1px solid #e2e4e9;border-radius:6px;width:26px;height:26px;font-size:13px;cursor:pointer;color:" + (i === 0 ? "#d1d5db" : "#1b2a4a") + ";";
    leftBtn.onclick = () => { moveProject(p, -1); refreshManagePanel(overlay); };
    controls.appendChild(leftBtn);

    const rightBtn = document.createElement("button");
    rightBtn.textContent = "→";
    rightBtn.disabled = i === active.length - 1;
    rightBtn.style.cssText = "background:none;border:1px solid #e2e4e9;border-radius:6px;width:26px;height:26px;font-size:13px;cursor:pointer;color:" + (i === active.length - 1 ? "#d1d5db" : "#1b2a4a") + ";";
    rightBtn.onclick = () => { moveProject(p, 1); refreshManagePanel(overlay); };
    controls.appendChild(rightBtn);

    const btn = document.createElement("button");
    btn.textContent = "Archive";
    btn.style.cssText = "background:none;border:1px solid #e2e4e9;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:#6b7280;";
    btn.onclick = () => {
      if (!state.archivedProjects) state.archivedProjects = [];
      state.archivedProjects.push(p);
      if (currentTab === p) currentTab = "Day to Day";
      queueSave();
      document.body.removeChild(overlay);
      render();
    };
    controls.appendChild(btn);
    row.appendChild(name);
    row.appendChild(controls);
    box.appendChild(row);
  });

  const archivedLabel = document.createElement("div");
  archivedLabel.textContent = "Archived";
  archivedLabel.style.cssText = "font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:#6b7280;margin:18px 0 6px;";
  box.appendChild(archivedLabel);

  const archived = state.archivedProjects || [];
  if (archived.length === 0) {
    const e = document.createElement("div");
    e.style.cssText = "font-size:13px;color:#6b7280;padding:6px 0;";
    e.textContent = "No archived projects.";
    box.appendChild(e);
  }
  archived.forEach(p => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e2e4e9;";
    const name = document.createElement("span");
    name.textContent = p;
    name.style.cssText = "font-size:14px;color:#9ca3af;";
    const btn = document.createElement("button");
    btn.textContent = "Restore";
    btn.style.cssText = "background:none;border:1px solid #e2e4e9;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:#1b2a4a;";
    btn.onclick = () => {
      state.archivedProjects = state.archivedProjects.filter(x => x !== p);
      queueSave();
      document.body.removeChild(overlay);
      render();
    };
    row.appendChild(name);
    row.appendChild(btn);
    box.appendChild(row);
  });

  const closeBtn = document.createElement("button");
  closeBtn.textContent = "Close";
  closeBtn.style.cssText = "width:100%;margin-top:16px;background:#1b2a4a;color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;cursor:pointer;";
  closeBtn.onclick = () => document.body.removeChild(overlay);
  box.appendChild(closeBtn);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function taskShareText(t) {
  let lines = ["Joe To Do — " + t.project, priorityLabel(t.priority), "", t.text];
  if (t.subtasks && t.subtasks.length) {
    lines.push("");
    t.subtasks.forEach(s => lines.push((s.done ? "[x] " : "[ ] ") + s.text));
  }
  return lines.join("\n");
}

function projectRank(p) {
  const order = state.projects; // full stored order (archived ones just won't normally appear here)
  const idx = order.indexOf(p);
  return idx === -1 ? 999 : idx;
}

function taskSortCompare(a, b) {
  const ap = effectivePriority(a), bp = effectivePriority(b);
  if (bp !== ap) return bp - ap;
  if (currentTab === "Day to Day") {
    const pr = projectRank(a.project) - projectRank(b.project);
    if (pr !== 0) return pr;
  }
  return (a.created || "").localeCompare(b.created || "");
}

function listShareText() {
  const tasks = tasksForCurrentTab();
  const notDone = tasks.filter(t => !t.done).sort(taskSortCompare);
  const done = tasks.filter(t => t.done);

  let lines = ["Joe To Do — " + currentTab, ""];
  let lastP = null;
  notDone.forEach(t => {
    const ep = effectivePriority(t);
    if (ep !== lastP) {
      lastP = ep;
      lines.push(priorityLabel(ep) + ":");
    }
    let line = "  • " + t.text;
    if (currentTab === "Day to Day") line += " (" + t.project + ")";
    if (t.due) line += " — due " + fmtDue(t.due);
    lines.push(line);
  });
  if (notDone.length === 0) lines.push("(nothing outstanding)");
  if (done.length) {
    lines.push("");
    lines.push("Done (" + done.length + "):");
    done.forEach(t => lines.push("  ✓ " + t.text));
  }
  return lines.join("\n");
}

async function shareList() {
  const text = listShareText();
  if (navigator.share) {
    try {
      await navigator.share({ title: "Joe To Do — " + currentTab, text: text });
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
  }
  showShareFallback(text);
}
document.getElementById("shareListBtn").onclick = shareList;
document.getElementById("toggleSubtasksBtn").onclick = () => {
  const tasksWithSubs = tasksForCurrentTab().filter(t => t.subtasks && t.subtasks.length);
  const anyCollapsed = tasksWithSubs.some(t => expandedTasks[t.id] === false);
  tasksWithSubs.forEach(t => { expandedTasks[t.id] = anyCollapsed ? true : false; });
  render();
};

async function shareTask(t) {
  const text = taskShareText(t);
  if (navigator.share) {
    try {
      await navigator.share({ title: "Joe To Do", text: text });
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
      // fall through to fallback on other errors
    }
  }
  showShareFallback(text);
}

function showShareFallback(text) {
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(20,25,45,0.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:110;";

  const box = document.createElement("div");
  box.style.cssText = "background:#fff;border-radius:12px;padding:22px;max-width:420px;width:100%;";

  const h = document.createElement("h2");
  h.textContent = "Share task";
  h.style.cssText = "margin-top:0;font-size:17px;color:#1b2a4a;";
  box.appendChild(h);

  const ta = document.createElement("textarea");
  ta.value = text;
  ta.readOnly = true;
  ta.style.cssText = "width:100%;height:110px;font-size:13px;padding:10px;border:1px solid #e2e4e9;border-radius:8px;font-family:inherit;resize:none;margin-bottom:12px;";
  box.appendChild(ta);

  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;";

  const copyBtn = document.createElement("button");
  copyBtn.textContent = "Copy text";
  copyBtn.style.cssText = "flex:1;background:#1b2a4a;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;cursor:pointer;";
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(text).then(() => { copyBtn.textContent = "Copied ✓"; setTimeout(() => copyBtn.textContent = "Copy text", 1500); });
  };
  row.appendChild(copyBtn);

  const waBtn = document.createElement("a");
  waBtn.textContent = "WhatsApp";
  waBtn.href = "https://wa.me/?text=" + encodeURIComponent(text);
  waBtn.target = "_blank";
  waBtn.style.cssText = "flex:1;text-align:center;background:#25D366;color:#fff;text-decoration:none;border-radius:8px;padding:10px;font-size:13px;";
  row.appendChild(waBtn);

  const mailBtn = document.createElement("a");
  mailBtn.textContent = "Email";
  mailBtn.href = "mailto:?subject=" + encodeURIComponent("Joe To Do task") + "&body=" + encodeURIComponent(text);
  mailBtn.style.cssText = "flex:1;text-align:center;background:#5a7fa6;color:#fff;text-decoration:none;border-radius:8px;padding:10px;font-size:13px;";
  row.appendChild(mailBtn);

  box.appendChild(row);

  const closeBtn = document.createElement("button");
  closeBtn.textContent = "Close";
  closeBtn.style.cssText = "width:100%;background:none;border:1px solid #e2e4e9;border-radius:8px;padding:10px;font-size:13.5px;color:#6b7280;cursor:pointer;";
  closeBtn.onclick = () => document.body.removeChild(overlay);
  box.appendChild(closeBtn);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function addProject() {
  const name = prompt("New project name:");
  if (!name) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  if (currentTabs().some(p => p.toLowerCase() === trimmed.toLowerCase())) {
    alert("A project with that name already exists.");
    return;
  }
  state.projects.push(trimmed);
  currentTab = trimmed;
  queueSave();
  render();
}

function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  } catch (e) { return ""; }
}

function tasksForCurrentTab() {
  if (currentTab === "Day to Day") {
    const arch = state.archivedProjects || [];
    return state.tasks.filter(t => !arch.includes(t.project));
  }
  return state.tasks.filter(t => t.project === currentTab);
}

function render() {
  renderTabs();

  const hint = document.getElementById("addHint");
  if (currentTab === "Day to Day") {
    hint.textContent = "Adding here files the task under 'General' — it'll show in Day to Day only.";
  } else {
    hint.textContent = "Adding here also shows the task in Day to Day, sorted by priority.";
  }

  const list = document.getElementById("taskList");
  list.innerHTML = "";
  const tasks = tasksForCurrentTab();

  const tasksWithSubs = tasks.filter(t => t.subtasks && t.subtasks.length);
  const toggleBtn = document.getElementById("toggleSubtasksBtn");
  if (tasksWithSubs.length === 0) {
    toggleBtn.style.display = "none";
  } else {
    toggleBtn.style.display = "";
    const anyCollapsed = tasksWithSubs.some(t => expandedTasks[t.id] === false);
    toggleBtn.textContent = anyCollapsed ? "Show subtasks" : "Hide subtasks";
  }

  const notDone = tasks.filter(t => !t.done).sort(taskSortCompare);
  const done = tasks.filter(t => t.done).sort((a, b) => (b.created || "").localeCompare(a.created || ""));

  if (tasks.length === 0) {
    const div = document.createElement("div");
    div.className = "empty";
    div.textContent = "No tasks yet in " + currentTab + ".";
    list.appendChild(div);
    return;
  }

  let lastPriority = null;
  notDone.forEach(t => {
    const ep = effectivePriority(t);
    if (ep !== lastPriority) {
      lastPriority = ep;
      const h = document.createElement("div");
      h.className = "priorityHeader";
      h.textContent = priorityLabel(ep);
      list.appendChild(h);
    }
    list.appendChild(taskRow(t));
  });

  if (done.length) {
    const h = document.createElement("div");
    h.className = "priorityHeader";
    h.textContent = "Done";
    list.appendChild(h);
    done.forEach(t => list.appendChild(taskRow(t)));
  }
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function daysUntilDue(t) {
  if (!t.due) return null;
  const due = new Date(t.due + "T00:00:00");
  const today = new Date(todayISO() + "T00:00:00");
  return Math.round((due - today) / 86400000);
}

function effectivePriority(t) {
  const d = daysUntilDue(t);
  let base = t.priority;
  if (d !== null) {
    let bump = null;
    if (d <= 0) bump = 5;      // due today or overdue
    else if (d === 1) bump = 4; // due tomorrow
    if (bump !== null) base = Math.max(base, bump);
  }
  if (t.subtasks && t.subtasks.length) {
    const openSubPriorities = t.subtasks.filter(s => !s.done).map(s => s.priority || 3);
    if (openSubPriorities.length) {
      base = Math.max(base, Math.max(...openSubPriorities));
    }
  }
  return base;
}

function fmtDue(iso) {
  try {
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  } catch (e) { return iso; }
}

function priorityLabel(p) {
  return { 5: "5 — Today", 4: "4 — High", 3: "3 — Medium", 2: "2 — Low", 1: "1 — Someday" }[p] || (p + "");
}

let expandedTasks = {};

function taskRow(t) {
  if (!t.subtasks) t.subtasks = [];
  const li = document.createElement("li");
  li.style.flexDirection = "column";
  li.style.alignItems = "stretch";
  const ep = effectivePriority(t);
  li.className = "task p" + ep + (t.done ? " done" : "");

  const topRow = document.createElement("div");
  topRow.style.display = "flex";
  topRow.style.alignItems = "flex-start";
  topRow.style.gap = "10px";

  const chk = document.createElement("div");
  chk.className = "chk";
  chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>';
  chk.onclick = () => toggleTask(t.id);

  const txtWrap = document.createElement("div");
  txtWrap.style.flex = "1";

  if (currentTab === "Day to Day") {
    const projLabel = document.createElement("div");
    projLabel.textContent = t.project;
    projLabel.style.cssText = "font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--gold); margin-bottom:2px;";
    txtWrap.appendChild(projLabel);
  }

  const txt = document.createElement("div");
  txt.className = "txt";
  txt.textContent = t.text;
  txt.ondblclick = () => startEdit(t.id, txt, txtWrap);

  const meta = document.createElement("div");
  meta.className = "meta";

  const dateSpanOnly = document.createElement("span");
  dateSpanOnly.textContent = fmtDate(t.created);
  meta.appendChild(dateSpanOnly);

  const prioSelect = document.createElement("select");
  prioSelect.className = "prioPick";
  prioSelect.title = "Your set priority (due date may bump how it's grouped)";
  [5,4,3,2,1].forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = "P" + p;
    if (p === t.priority) opt.selected = true;
    prioSelect.appendChild(opt);
  });
  prioSelect.onchange = () => changePriority(t.id, parseInt(prioSelect.value, 10));
  meta.appendChild(prioSelect);

  const dueDays = daysUntilDue(t);
  const dueInput = document.createElement("input");
  dueInput.type = "date";
  dueInput.value = t.due || "";
  dueInput.className = "duePick";
  let dueColor = "#e2e4e9";
  if (t.due) {
    dueColor = (dueDays !== null && dueDays <= 0) ? "#b3454a" : (dueDays === 1) ? "#c97a3a" : "#e2e4e9";
  }
  dueInput.style.cssText = "font-size:11px; border:1px solid " + dueColor + "; border-radius:5px; padding:1px 3px; color:" + (t.due ? dueColor : "var(--muted)") + ";";
  dueInput.title = t.due ? (dueDays !== null && dueDays < 0 ? "Overdue" : dueDays === 0 ? "Due today" : dueDays === 1 ? "Due tomorrow" : "Due date") : "Set a due date (optional)";
  dueInput.onchange = () => changeDue(t.id, dueInput.value);
  meta.appendChild(dueInput);

  const doneSubs = t.subtasks.filter(s => s.done).length;
  const subToggle = document.createElement("span");
  subToggle.className = "subToggle";
  const isExpanded = expandedTasks[t.id] !== false;
  subToggle.textContent = (isExpanded ? "▾ " : "▸ ") + "Subtasks" + (t.subtasks.length ? " (" + doneSubs + "/" + t.subtasks.length + ")" : "");
  subToggle.onclick = () => { expandedTasks[t.id] = !isExpanded; render(); };
  meta.appendChild(subToggle);

  txtWrap.appendChild(txt);
  txtWrap.appendChild(meta);

  const actions = document.createElement("div");
  actions.className = "actions";

  const editBtn = document.createElement("button");
  editBtn.className = "edit";
  editBtn.title = "Edit";
  editBtn.textContent = "✎";
  editBtn.onclick = () => startEdit(t.id, txt, txtWrap);
  actions.appendChild(editBtn);

  const shareBtn = document.createElement("button");
  shareBtn.className = "share";
  shareBtn.title = "Share";
  shareBtn.textContent = "↥";
  shareBtn.onclick = () => shareTask(t);
  actions.appendChild(shareBtn);

  const delBtn = document.createElement("button");
  delBtn.className = "del";
  delBtn.title = "Delete";
  delBtn.textContent = "✕";
  delBtn.onclick = () => deleteTask(t.id);
  actions.appendChild(delBtn);

  topRow.appendChild(chk);
  topRow.appendChild(txtWrap);
  topRow.appendChild(actions);
  li.appendChild(topRow);

  if (isExpanded) {
    li.appendChild(subtaskSection(t));
  }

  return li;
}

function startEdit(id, txtEl, container) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const input = document.createElement("input");
  input.className = "editInput";
  input.type = "text";
  input.value = t.text;
  container.replaceChild(input, txtEl);
  input.focus();
  input.select();
  const commit = () => {
    const val = input.value.trim();
    if (val) t.text = val;
    queueSave();
    render();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { commit(); }
    if (e.key === "Escape") { render(); }
  });
  input.addEventListener("blur", commit);
}

function subtaskSection(t) {
  const wrap = document.createElement("div");
  wrap.className = "subSection";

  t.subtasks.forEach(s => {
    if (!s.priority) s.priority = 3;
    const row = document.createElement("div");
    row.className = "subRow" + (s.done ? " done" : "");

    const chk = document.createElement("div");
    chk.className = "subChk";
    chk.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"><path d="M4 12l6 6L20 6"/></svg>';
    chk.onclick = () => { s.done = !s.done; queueSave(); render(); };

    const txt = document.createElement("div");
    txt.className = "subTxt";
    txt.textContent = s.text;
    txt.style.color = s.done ? "" : ({5:"var(--p5)",4:"var(--p4)",3:"var(--p3)",2:"var(--p2)",1:"var(--p1)"}[s.priority] || "");
    txt.ondblclick = () => {
      const input = document.createElement("input");
      input.className = "editInput";
      input.style.fontSize = "13px";
      input.value = s.text;
      row.replaceChild(input, txt);
      input.focus(); input.select();
      const commit = () => { const v = input.value.trim(); if (v) s.text = v; queueSave(); render(); };
      input.addEventListener("keydown", e => { if (e.key === "Enter") commit(); if (e.key === "Escape") render(); });
      input.addEventListener("blur", commit);
    };

    const subPrio = document.createElement("select");
    subPrio.style.cssText = "font-size:11px; border:1px solid var(--border); border-radius:5px; padding:1px 3px;";
    [5,4,3,2,1].forEach(p => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = "P" + p;
      if (p === s.priority) opt.selected = true;
      subPrio.appendChild(opt);
    });
    subPrio.onchange = () => { s.priority = parseInt(subPrio.value, 10); queueSave(); render(); };

    const del = document.createElement("button");
    del.className = "subDel";
    del.textContent = "✕";
    del.onclick = () => { t.subtasks = t.subtasks.filter(x => x.id !== s.id); queueSave(); render(); };

    row.appendChild(chk);
    row.appendChild(txt);
    row.appendChild(subPrio);
    row.appendChild(del);
    wrap.appendChild(row);
  });

  const addRow = document.createElement("div");
  addRow.className = "subAddRow";
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Add subtask…";
  const subPrioSelect = document.createElement("select");
  subPrioSelect.style.cssText = "font-size:12px; border:1px solid var(--border); border-radius:6px; padding:2px 4px;";
  [5,4,3,2,1].forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = "P" + p;
    if (p === 3) opt.selected = true;
    subPrioSelect.appendChild(opt);
  });
  const addBtn = document.createElement("button");
  addBtn.textContent = "Add";
  const doAdd = () => {
    const val = input.value.trim();
    if (!val) return;
    t.subtasks.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      text: val,
      done: false,
      priority: parseInt(subPrioSelect.value, 10)
    });
    input.value = "";
    queueSave();
    render();
  };
  addBtn.onclick = doAdd;
  input.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
  addRow.appendChild(input);
  addRow.appendChild(subPrioSelect);
  addRow.appendChild(addBtn);
  wrap.appendChild(addRow);

  return wrap;
}

function toggleTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (t) { t.done = !t.done; queueSave(); render(); }
}

function changePriority(id, p) {
  const t = state.tasks.find(x => x.id === id);
  if (t) { t.priority = p; queueSave(); render(); }
}

function changeDue(id, val) {
  const t = state.tasks.find(x => x.id === id);
  if (t) { t.due = val || null; queueSave(); render(); }
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(x => x.id !== id);
  queueSave();
  render();
}

function addTask(text, priority, due) {
  if (!text.trim()) return;
  const project = currentTab === "Day to Day" ? GENERAL_PROJECT : currentTab;
  const t = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    text: text.trim(),
    done: false,
    created: new Date().toISOString(),
    project: project,
    priority: priority,
    due: due || null,
    subtasks: []
  };
  state.tasks.push(t);
  queueSave();
  render();
}

document.getElementById("addTaskBtn").onclick = () => {
  const input = document.getElementById("newTaskInput");
  const prio = parseInt(document.getElementById("prioritySelect").value, 10);
  const due = document.getElementById("dueDateInput").value;
  addTask(input.value, prio, due);
  input.value = "";
  document.getElementById("dueDateInput").value = "";
  input.focus();
};
document.getElementById("newTaskInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("addTaskBtn").click();
});
document.getElementById("syncBtn").onclick = () => loadFromGitHub();

document.getElementById("saveTokenBtn").onclick = async () => {
  const val = document.getElementById("tokenInput").value.trim();
  if (!val.startsWith("github_pat_") && !val.startsWith("ghp_")) {
    document.getElementById("tokenErr").textContent = "That doesn't look like a GitHub token.";
    return;
  }
  token = val;
  localStorage.setItem("oraa_todo_token", token);
  document.getElementById("setupOverlay").style.display = "none";
  await loadFromGitHub();
};

if (token) {
  document.getElementById("setupOverlay").style.display = "none";
  loadFromGitHub();
} else {
  setStatus("Not connected");
}
render();

window.addEventListener("beforeunload", (e) => {
  if (dirty) { e.preventDefault(); e.returnValue = ""; }
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
